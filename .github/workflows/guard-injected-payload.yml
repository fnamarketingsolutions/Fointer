name: Guard injected payload

on:
  push:
    branches: [main, ashhad]
  pull_request:
    branches: [main, ashhad]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block known malware entry points
        run: node scripts/check-no-injected-payload.mjs
